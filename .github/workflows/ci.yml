name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: continuity
          POSTGRES_PASSWORD: continuity
          POSTGRES_DB: continuity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U continuity -d continuity_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.11"}
      - run: uv sync --extra dev
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: whatsapp-bridge/package-lock.json}
      - run: npm ci && npm test && npm audit --omit=dev
        working-directory: whatsapp-bridge
      - run: uv run pytest -q && uv run ruff check app tests && uv run mypy app
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://continuity:continuity@127.0.0.1:5432/continuity_test
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run audit:ci && npm run lint && npm run typecheck && npm run build
        working-directory: frontend
