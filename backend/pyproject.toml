[project]
name="continuity-backend"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn>=0.30","sqlalchemy>=2.0","alembic>=1.13","psycopg[binary]>=3.2","pydantic-settings>=2.5","itsdangerous>=2.2","httpx>=0.27,<1"]
[project.optional-dependencies]
dev=["pytest>=8","ruff>=0.8","mypy>=1.13"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
filterwarnings=["ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning"]
[tool.ruff]
line-length=100
[tool.ruff.lint]
select=["E","F","I"]
[tool.mypy]
python_version="3.11"
ignore_missing_imports=true
[tool.setuptools.packages.find]
include=["app*"]
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
