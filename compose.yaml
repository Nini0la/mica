services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: continuity
      POSTGRES_PASSWORD: continuity
      POSTGRES_DB: continuity
    ports: ["5432:5432"]
    volumes: [continuity-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuity"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  continuity-db:
